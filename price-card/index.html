<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price Card</title>
  <link rel="stylesheet" href="assets/scss/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body style="background-color:#f4eeff;">
  <div class="container">
    
    <div class="container_pricecard"> 

        <p class="container_pricecard-title--xll">590,-</p>
        <p class="container_pricecard-title--xl">pay now, later or split up.</p>

      <button class="container_pricecard-btn">BUY ONLINE</button>

      <p class="container_pricecard-title--m">18 in online storage <span class="container_pricecard-title--m normal">-can be shipped today <i class="fas fa-circle-check"></i></span></p>
      <p class="container_pricecard-title--s">free shipping all over Cyprus <i class="fas fa-circle-check"></i></p>
      <p class="container_pricecard-title--ss">lightning fast delivery</p>

      <div class="container_pricecard-pricing">
        <p class="container_pricecard-pricing-title-m">See how fast you can get to the item</p>

        <button class="container_pricecard-pricing-btn--1">Zipcode</button>
        <button class="container_pricecard-pricing-btn--2">Check</button>

      </div>
<button class="container_pricecard-btn2">PICK UP STORE.</button>
     
    </div>
  </div>
</body>
</html>
